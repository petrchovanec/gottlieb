    caution: "This claim concerns the child in the Vienna register. The record does not by itself link him to the Zürich or Baden-Baden hotel careers."
    public_wording: "A Vienna parish register records a Sylvester Hermann Gottlieb born on 8 December 1871. Whether he was the later hotelier remains strongly supported but unproved."

